</style><header><h1>VinClub · Mindmap từ chiến lược đến UX</h1><nav><label>Mốc <select id="period"><option value="all">Tất cả</option><option value="feb">Đến 28/02/2027 · lũy kế</option><option value="end">Đến 31/12/2027 · lũy kế</option><option value="done">HOÀN THÀNH</option><option value="undated">Chưa có hạn</option></select></label><button id="overview">Thu gọn</button><button id="expand">Mở tất cả</button><span id="count"></span><a class="tools" href="index.html">Đối chiếu bảng</a></nav><p class="legend">Ý gốc Excel có mã nguồn. <strong class="authored">Xanh lá = phân rã Feature, nhu cầu và metric do mình đề xuất.</strong> Filter áp dụng Scope; Strategy giữ nguyên. Chưa phân tích UX thì ghi rõ.</p></header><main><div id="map"><div class="root">VinClub</div><div id="tree"></div></div><p id="empty" hidden>Không có hạng mục khớp mốc.</p></main><script>const rows=[{"code": "1", "title": "TIỆN ÍCH HẰNG NGÀY", "description": "", "date": "", "note": "", "ref": "B3!C5:F5", "analysis": []}, {"code": "1.1", "title": "Kết nối và xây dựng cộng đồng", "description": "", "date": "", "note": "Duhat chưa có kế hoạch phát triển và cung cấp SDK tích hợp cho VinClub.", "ref": "B3!C6:F6", "analysis": []}, {"code": "1.2", "title": "Hệ điểm & thanh toán chung", "description": "", "date": "", "note": "", "ref": "B3!C7:F7", "analysis": []}, {"code": "1.2.1", "title": "Tích điểm", "description": "Ghi nhận VPoint từ giao dịch và hành vi mục tiêu theo chính sách từng chương trình. Quản lý hệ số thưởng, ngân sách và điều kiện để điều hướng chi tiêu, tương tác và sử dụng chéo P&L.", "date": "", "note": "", "ref": "B3!C8:F8", "analysis": []}, {"code": "1.2.1.1", "title": "Đơn hàng từ PnL", "description": "Nhận đơn hàng của mọi PnL theo một chuẩn chung, có chống trùng, cập nhật, huỷ và tính lại; PnL tra được kết quả từng đơn.", "date": "HOÀN THÀNH", "note": "", "ref": "B3!C9:F9", "analysis": []}, {"code": "1.2.1.2", "title": "Chính sách tích điểm (Scheme)", "description": "BO tự cấu hình và chạy thử chính sách tích điểm theo Program và PnL, không phải nhờ PnL hay đội kỹ thuật.", "date": "HOÀN THÀNH", "note": "", "ref": "B3!C10:F10", "analysis": []}, {"code": "1.2.1.3", "title": "Tích điểm theo giao dịch", "description": "Cho phép tích điểm khi mua SPDV PnLs hoặc của đối tác ngoài (gian hàng của Vincom) và tăng hệ số tích khi thanh toán bằng VinPay", "date": "30/11/2026", "note": "", "ref": "B3!C11:F11", "analysis": []}, {"code": "1.2.1.4", "title": "Tích điểm theo chiến dịch", "description": "Cho phép cấu hình tỷ lệ điểm tích ngoài chính sách căn bản, phục vụ thúc đẩy bán hàng PnLs vào các mùa/giờ thấp điểm, lấp công suất trống", "date": "30/11/2026", "note": "", "ref": "B3!C12:F12", "analysis": []}, {"code": "1.2.2", "title": "Tiêu điểm", "description": "Cho phép dùng VPoint để khấu trừ hóa đơn, đổi voucher, quà và trải nghiệm hội viên hoặc đóng góp thiện nguyện. Áp dụng điều kiện quy đổi và quyền tiếp cận theo từng chương trình.", "date": "", "note": "", "ref": "B3!C13:F13", "analysis": []}, {"code": "1.2.2.1", "title": "Khấu trừ VPoint khi thanh toán", "description": "Hiển thị số điểm có thể dùng, giá trị khấu trừ và số tiền còn phải trả. Xác nhận trừ điểm cùng kết quả giao dịch, hoàn điểm theo chính sách khi hủy hoặc hoàn.", "date": "28/02/2027", "note": "", "ref": "B3!C14:F14", "analysis": [{"feature": "Chọn VPoint để khấu trừ", "needs": ["User: As a user, I need biết mình dùng được bao nhiêu VPoint và còn phải trả bao nhiêu trước khi xác nhận.", "Product: As a product, we need đưa VPoint vào giao dịch mà khách vẫn hiểu đúng nguồn tiền và số tiền thực trả."], "metrics": ["UX metric: Tỷ lệ hiểu đúng số tiền thực trả", "Cách tính: Số người trả lời đúng số điểm dùng và số tiền còn trả / số người được giao tác vụ thanh toán kết hợp điểm.", "Cách kiểm tra: Cho khách một giỏ hàng và số dư mẫu; hỏi trước xác nhận, không gợi đáp án."]}]}, {"code": "1.2.2.2", "title": "Đổi voucher và quà tặng", "description": "Tra cứu danh mục, số điểm cần đổi và tồn kho. Xác nhận đổi thưởng, cấp voucher hoặc ghi nhận yêu cầu giao quà và theo dõi trạng thái.", "date": "30/11/2026", "note": "", "ref": "B3!C15:F15", "analysis": []}, {"code": "1.2.3", "title": "Quản lý và trải nghiệm điểm", "description": "Quản lý tập trung số dư, lịch sử và hạn sử dụng VPoint. Hỗ trợ tích, tiêu theo gia đình/nhóm và quy đổi điểm với P&L, đối tác theo cơ chế thống nhất.", "date": "", "note": "", "ref": "B3!C16:F16", "analysis": []}, {"code": "1.2.3.1", "title": "Tài khoản khách hàng", "description": "Mỗi khách hàng có một tài khoản VinClub duy nhất, đăng nhập an toàn trên nhiều thiết bị.", "date": "HOÀN THÀNH", "note": "", "ref": "B3!C17:F17", "analysis": []}, {"code": "1.2.3.2", "title": "Hợp nhất danh tính", "description": "Ghép hồ sơ khách từ mọi PnL vào đúng một tài khoản VinClub để VPoint, hạng và quyền lợi cộng dồn đúng.", "date": "HOÀN THÀNH", "note": "", "ref": "B3!C18:F18", "analysis": []}, {"code": "1.2.3.3", "title": "Xác minh danh tính eKYC", "description": "Thay eyePass của Vin Big Data (đã dừng hoạt động) bằng VNeID hoặc căn cước gắn chip, đối chiếu với Trung tâm RAR thuộc C06, Bộ Công an.", "date": "HOÀN THÀNH", "note": "", "ref": "B3!C19:F19", "analysis": []}, {"code": "1.2.3.4", "title": "Consent và bảo vệ dữ liệu cá nhân", "description": "Khách biết, đồng ý hoặc rút đồng ý theo từng mục đích. Dữ liệu cá nhân được che mặc định; chỉ người có quyền mới xem được bản đầy đủ.", "date": "HOÀN THÀNH", "note": "", "ref": "B3!C20:F20", "analysis": []}, {"code": "1.2.3.5", "title": "Ví và sổ cái điểm", "description": "Ghi đúng VPoint vào ví thành viên theo từng lô điểm, quản lý thời điểm được dùng, hạn dùng và thứ tự sử dụng.", "date": "HOÀN THÀNH", "note": "", "ref": "B3!C21:F21", "analysis": []}, {"code": "1.2.3.6", "title": "Tiêu VPoint", "description": "Khách dùng VPoint để trừ tiền tại PnL hoặc đổi lấy voucher theo chiến dịch đang hiệu lực.", "date": "HOÀN THÀNH", "note": "", "ref": "B3!C22:F22", "analysis": []}, {"code": "1.2.3.7", "title": "Chuyển và nạp VPoint", "description": "Khách chuyển VPoint cho thành viên khác cùng chương trình và mua thêm VPoint qua cổng thanh toán.", "date": "HOÀN THÀNH", "note": "", "ref": "B3!C23:F23", "analysis": []}, {"code": "1.2.3.8", "title": "Số dư, lịch sử và hạn sử dụng điểm", "description": "Hiển thị điểm khả dụng, các giao dịch tích/tiêu/điều chỉnh và thời điểm hết hạn. Nhắc sử dụng điểm và gợi ý nơi áp dụng phù hợp.", "date": "30/11/2026", "note": "", "ref": "B3!C24:F24", "analysis": []}, {"code": "1.2.3.9", "title": "Tích & Tiêu điểm cho CBNV", "description": "Cho phép tích & tiêu điểm cho CBNV Tập đoàn", "date": "31/12/2026", "note": "", "ref": "B3!C25:F25", "analysis": []}, {"code": "1.2.3.10", "title": "Tích & Tiêu theo hệ đa điểm", "description": "Cho phép nhiều hệ điểm ở các PnLs/thị trường", "date": "31/01/2027", "note": "", "ref": "B3!C26:F26", "analysis": []}, {"code": "1.2.3.11", "title": "Quản trị và đối soát điểm", "description": "Theo dõi điểm phát hành, sử dụng, hoàn và hết hạn theo P&L, đối tác, chương trình. Đối chiếu nghĩa vụ điểm và xử lý sai lệch.", "date": "24/12/2026", "note": "", "ref": "B3!C27:F27", "analysis": []}, {"code": "1.2.4", "title": "Giải pháp thanh toán cho khách hàng", "description": "Tích hợp tài khoản, nguồn tiền và thanh toán vào VinClub, Green SM và các P&L. Hỗ trợ QR, hóa đơn, giao dịch trong chat và kết hợp quyền lợi VPoint tại bước thanh toán.", "date": "", "note": "", "ref": "B3!C28:F28", "analysis": []}, {"code": "1.2.4.1", "title": "Đăng ký & Kích hoạt ứng dụng Ví", "description": "Liên kết tài khoản ngân hàng: Kết nối Ví VinPay với thêm 06 ngân hàng lớn (VietinBank, Vietcombank, MB, ACB, VPBank, LPBank), mở rộng tệp khách hàng tiếp cận, hỗ trợ nạp/rút/thanh toán liền mạch", "date": "HOÀN THÀNH", "note": "", "ref": "B3!C29:F29", "analysis": []}, {"code": "1.2.4.2", "title": "Thanh toán nhúng cho dịch vụ VGreen trên ứng dụng Vinfast eScooter", "description": "Hỗ trợ khách hàng liên kết ví V-Smart Pay và sử dụng ví để thanh toán cho các dịch vụ của VGreen trên ứng dụng Vinfast eScooter.", "date": "HOÀN THÀNH", "note": "", "ref": "B3!C30:F30", "analysis": []}, {"code": "1.2.4.3", "title": "Đăng ký và kích hoạt Sinh lời tự động", "description": "Cung cấp lãi suất cao nhất thị trường thu hút dòng tiền về Ví để thực hiện giao dịch thường xuyên, kiểm thử hành vi người dùng và độ ổn định sản phẩm trước khi triển khai trên VinClub.", "date": "HOÀN THÀNH", "note": "", "ref": "B3!C31:F31", "analysis": []}, {"code": "1.2.4.4", "title": "Đăng ký và liên kết nguồn tiền trên VinClub", "description": "Tích hợp SDK VinPay trên VinClub: đăng ký/eKYC, liên kết ngân hàng, nạp/rút, số dư và lịch sử.", "date": "24/12/2026", "note": "", "ref": "B3!C32:F32", "analysis": []}, {"code": "1.2.4.5", "title": "Thanh toán QR tại điểm bán trên VinClub", "description": "Thanh toán QR tại các điểm bán trong và ngoài hệ sinh thái qua đa dạng phương thức VietQR, VietQRPay, VNPAY-QR,... quét mã, kiểm tra người nhận, số tiền và lựa chọn nguồn tiền phù hợp. Hiển thị kết quả, lịch sử và hỗ trợ tra soát giao dịch.", "date": "31/12/2026", "note": "", "ref": "B3!C33:F33", "analysis": [{"feature": "Quét QR và xác nhận thanh toán", "needs": ["User: As a user, I need quét mã, kiểm tra đúng người nhận và hoàn tất thanh toán mà không phải tìm đường tiếp.", "Product: As a product, we need khách hoàn tất đúng giao dịch và không xác nhận nhầm người nhận/số tiền."], "metrics": ["UX metric: Tỷ lệ hoàn tất tác vụ không cần trợ giúp", "Cách tính: Số người thanh toán đúng người nhận và số tiền, không cần hướng dẫn / số người bắt đầu tác vụ QR.", "Cách kiểm tra: Quan sát toàn luồng; ghi riêng lỗi chọn nguồn tiền, sửa số tiền và cần trợ giúp."]}, {"feature": "Tra cứu trạng thái giao dịch", "needs": ["User: As a user, I need biết giao dịch thành công, thất bại hay đang xử lý để không trả lại hai lần.", "Product: As a product, we need hiển thị trạng thái đủ rõ để khách chọn hành động tiếp theo phù hợp."], "metrics": ["UX metric: Tỷ lệ hiểu đúng trạng thái và bước tiếp theo", "Cách tính: Số người xác định đúng trạng thái và hành động tiếp theo / số người xem tình huống thành công, thất bại hoặc đang xử lý.", "Cách kiểm tra: Dùng ba trạng thái mẫu; hỏi khách sẽ làm gì tiếp, không chỉ hỏi có hiểu không."]}]}, {"code": "1.2.4.6", "title": "Thanh toán hóa đơn và tiện ích trên VinClub", "description": "Tra cứu hóa đơn, xác nhận thanh toán, lưu thông tin dịch vụ và nhắc kỳ thanh toán tiếp theo. Cập nhật kết quả từ nhà cung cấp.", "date": "31/12/2026", "note": "", "ref": "B3!C34:F34", "analysis": []}, {"code": "1.2.4.7", "title": "Thanh toán nhúng trong HST", "description": "Tích hợp thanh toán vào hành trình VinClub, Green SM, Vinpearl OTA,.... Đồng bộ trạng thái thanh toán với đơn hàng hoặc yêu cầu chia hóa đơn.", "date": "31/12/2026", "note": "Tiến độ phụ thuộc vào mức độ sẵn sàng của các nền tảng tích hợp.", "ref": "B3!C35:F35", "analysis": []}, {"code": "1.2.4.8", "title": "Thanh toán QR xuyên biên giới trên VinClub", "description": "Hiển thị thông tin quy đổi, phí và số tiền trước xác nhận. Theo dõi kết quả thanh toán và xử lý tra soát qua mạng lưới đối tác kết nối.", "date": "28/02/2027", "note": "", "ref": "B3!C36:F36", "analysis": []}, {"code": "1.2.5", "title": "Giải pháp thanh toán cho Merchant", "description": "Cung cấp chấp nhận thanh toán online/offline và công cụ quản lý dòng tiền cho Merchant. Kết nối điểm, ưu đãi, đối soát, quyết toán.", "date": "", "note": "", "ref": "B3!C37:F37", "analysis": []}, {"code": "1.2.5.1", "title": "Thanh toán tại điểm bán", "description": "Hỗ trợ Merchant nhận thanh toán qua thẻ, QR, SmartPOS và thiết bị tự phục vụ tại cửa hàng, bãi xe, trạm sạc,... Mở rộng QR quốc tế (Alipay+, WeChat Pay,...).", "date": "28/02/2027", "note": "", "ref": "B3!C38:F38", "analysis": []}, {"code": "1.2.5.2", "title": "Giải pháp thu/chi hộ", "description": "Thu tiền từ khách theo nhiều cách (thu hộ hoá đơn, thu định kỳ, thu theo đơn hàng), đồng thời trả tiền hàng loạt cho nhà cung n để cấp ưu đãi cho lần sử dụng đầu tiên và khuyến khích khách quay lại; áp dụng điều kiện, thời hạn và hạn mức theo từng chương trình.", "date": "15/01/2027", "note": "", "ref": "B3!C46:F46", "analysis": []}, {"code": "1.3.1.4", "title": "Định danh và quyền chia sẻ giữa VinClub/PnL", "description": "Liên kết tài khoản theo dữ liệu tối thiểu được phép; lưu nguồn, consent và mục đích chia sẻ. Tách người mới, đã có tài khoản và đăng nhập lại.", "date": "24/12/2026", "note": "", "ref": "B3!C47:F47", "analysis": []}, {"code": "1.3.2", "title": "Mở Cửa Tết 2027", "description": "Phát hành lần lượt 5 cửa trải nghiệm trên VinClub; mỗi cửa kết nối nhiệm vụ, quyền lợi với sử dụng dịch vụ PnL, thúc đẩy bán chéo và O2O.", "date": "", "note": "Thứ tự triển khai và danh mục các cửa có thể điều chỉnh tùy theo tiến độ thực tế và mức độ sẵn sàng của các PnLs", "ref": "B3!C48:F48", "analysis": []}, {"code": "1.3.2.1", "title": "Cửa Đủ Đầy – VinClub & VinPay", "description": "Ra mắt sảnh chiến dịch, đăng nhập, nhận Dê Lộc và cửa đầu tiên. Khách khám phá quyền lợi hội viên, hoàn thành nhiệm vụ, nhận vật phẩm/quà và được dẫn tới sử dụng VPoint, thanh toán. Các cửa chưa phát hành hiển thị lịch mở.", "date": "15/01/2027", "note": "", "ref": "B3!C49:F49", "analysis": []}, {"code": "1.3.2.2", "title": "Cửa Lăn Bánh – VinFast", "description": "Khách chọn mẫu xe, trang trí bằng mẫu có sẵn, lưu/chia sẻ ảnh và hoàn thành bộ sưu tập. Kết nối nhu cầu với đăng ký tư vấn, đặt lịch lái thử; chuyển thông tin tới VinFast khi khách đồng ý.", "date": "22/01/2027", "note": "", "ref": "B3!C50:F50", "analysis": []}, {"code": "1.3.2.3", "title": "Cửa An Cư – Vinhomes", "description": "Khách chọn, trang trí không gian Tết bằng mẫu có sẵn và khám phá tiện ích dự án. Kết nối với đăng ký tư vấn, tham quan nhà mẫu/khu đô thị; ghi nhận tiếp nhận và lịch hẹn từ Vinhomes.", "date": "29/01/2027", "note": "", "ref": "B3!C51:F51", "analysis": []}, {"code": "1.3.2.4", "title": "Cửa Vui Hội – Vincom Retail", "descripti const $=id=>document.getElementById(id);function el(tag,text,cls){const n=document.createElement(tag);if(text)n.textContent=text;if(cls)n.className=cls;return n}function branch(title,cls,open=false){const d=el('details',null,cls);d.open=open;d.append(el('summary',title));return d}function leaf(parent,label,text,authored=false,ref=''){if(!text)return;const n=el('div',null,'node'+(authored?' authored':''));if(label)n.append(el('span',label,'label'));n.append(el('p',text));if(ref)n.append(el('small',ref,'meta'));parent.append(n)}function iso(date){const m=date.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?m[3]+'-'+m[2]+'-'+m[1]:''}function matches(r,f){const i=iso(r.date);return f==='all'||f==='done'&&r.date==='HOÀN THÀNH'||f==='undated'&&!i&&r.date!=='HOÀN THÀNH'||f===r.date||(f==='feb'||f==='end')&&(r.date==='HOÀN THÀNH'||i&&i<=(f==='feb'?'2027-02-28':'2027-12-31'))}function hasSelected(r,f){return matches(r,f)||rows.some(x=>x.code.startsWith(r.code+'.')&&matches(x,f))}function renderRow(r,parent,f){if(!hasSelected(r,f))return;const d=branch(r.code+' · '+r.title,'scope');d.dataset.code=r.code;if(r.date)d.querySelector('summary').append(el('span',r.date,'badge'));if(matches(r,f)){leaf(d,'Scope · nguyên văn',r.description,false,r.ref);leaf(d,'Ghi chú / phụ thuộc · nguyên văn',r.note,false,'B3 · '+r.code);for(const a of r.analysis){const feature=branch('Feature · '+a.feature,'analysis');for(const text of a.needs)leaf(feature,'',text,true);const metric=branch('UX metric','analysis');for(const text of a.metrics)leaf(metric,'',text,true);feature.append(metric);d.append(feature)}const children=rows.filter(x=>x.code.startsWith(r.code+'.')&&x.code.split('.').length===r.code.split('.').length+1);if(!r.analysis.length&&!children.length)leaf(d,'UX','Chưa phân tích Feature / User need / Product need / UX metric cho mục này.',true);if(r.code==='1.3.2.7')leaf(d,'Game Mở Cửa Tết · dữ liệu tổng kết','Tổng kết khách dùng chéo PnL, lượt đến, lead và giao dịch.',false,'B3!D55 · chỉ thuộc chiến dịch này')}
rows.filter(x=>x.code.startsWith(r.code+'.')&&x.code.split('.').length===r.code.split('.').length+1).forEach(x=>renderRow(x,d,f));parent.append(d)}function render(){const f=$('period').value,tree=$('tree');tree.replaceChildren();for(const root of rows.filter(r=>!r.code.includes('.'))){if(!hasSelected(root,f))continue;const d=branch(root.code+' · '+root.title,'pillar',true);const ss=strategies.filter(x=>x.code.startsWith(root.code+'.'));if(ss.length){const st=branch('Strategy · nhu cầu khách hàng & lợi ích Tập đoàn','strategy');for(const x of ss){const b=branch(x.code+' · '+x.title);leaf(b,'Nhu cầu khách hàng · nguyên văn',x.user,false,x.ref);leaf(b,'Lợi ích Tập đoàn · nguyên văn',x.business,false,x.ref);st.append(b)}d.append(st)}const scope=branch('Scope → Feature → User / Product need → UX metric','',true);rows.filter(r=>r.code.startsWith(root.code+'.')&&r.code.split('.').length===2).forEach(r=>renderRow(r,scope,f));d.append(scope);tree.append(d)}$('count').textContent=rows.filter(r=>matches(r,f)).length+' dòng khớp mốc';$('empty').hidden=tree.children.length>0}const dates=[...new Set(rows.map(r=>r.date).filter(d=>iso(d)))].sort((a,b)=>iso(a).localeCompare(iso(b)));dates.forEach(d=>{const o=el('option',d);o.value=d;$('period').append(o)});$('period').onchange=render;$('expand').onclick=()=>document.querySelectorAll('#tree details').forEach(d=>d.open=true);$('overview').onclick=()=>document.querySelectorAll('#tree details').forEach(d=>d.open=d.classList.contains('pillar'));render();</script></html>
